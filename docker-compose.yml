networks:
    app-network:
        driver: bridge

services:
    app:
        # container_name: app
        build:
            context: .
            dockerfile: Dockerfile
        image: php-laravel-13
        restart: unless-stopped
        tty: true
        working_dir: /var/www
        environment:
            APP_URL: http://localhost:8101
            DB_CONNECTION: pgsql
            DB_HOST: db
            DB_PORT: 5432
            DB_DATABASE: katagigi
            DB_USERNAME: admin
            DB_PASSWORD: admin
            SESSION_DRIVER: database
            CACHE_STORE: database
            QUEUE_CONNECTION: database
        volumes:
            - ./:/var/www
        depends_on:
            db:
                condition: service_healthy
        networks:
            - app-network

    db:
        image: postgres:12.15-alpine3.18
        restart: unless-stopped
        ports:
            - "5434:5432"
        volumes:
            - pgsql_data:/var/lib/postgresql/data
        environment:
            POSTGRES_DB: katagigi
            POSTGRES_USER: admin
            POSTGRES_PASSWORD: admin
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U admin -d katagigi"]
            interval: 5s
            timeout: 5s
            retries: 20
        networks:
            - app-network

    nginx:
        image: nginx:1.19.8-alpine
        # container_name: nginx
        restart: unless-stopped
        tty: true
        ports:
            - 8101:80
        volumes:
            - ./:/var/www
            - ./infra/nginx:/etc/nginx/conf.d
        depends_on:
            - app
        networks:
            - app-network
    node:
        image: node:24
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ./:/var/www
            - node_modules:/var/www/node_modules
        ports:
            - "5173:5173"
        networks:
            - app-network
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
        profiles:
            - frontend
volumes:
  node_modules:
  pgsql_data:
